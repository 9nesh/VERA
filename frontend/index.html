<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA — Verified Environmental Review &amp; Attestation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0f1c2e', light: '#162338', border: '#1e3050' },
            vera: { teal: '#0d9488', 'teal-dark': '#0f766e', 'teal-light': '#14b8a6' }
          },
          fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>

<body
  class="bg-slate-50 min-h-screen text-slate-800"
  x-data="vera()"
  x-init="init()"
>

  <!-- ── Toast notifications ─────────────────────────────────────────── -->
  <div class="fixed top-4 right-4 z-50 space-y-2" aria-live="polite">
    <template x-for="toast in toasts" :key="toast.id">
      <div
        class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-lg text-sm font-medium max-w-sm"
        :class="toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'"
      >
        <span x-text="toast.msg" class="flex-1"></span>
        <button @click="removeToast(toast.id)" class="opacity-70 hover:opacity-100 ml-2">✕</button>
      </div>
    </template>
  </div>

  <!-- ── Global header ───────────────────────────────────────────────── -->
  <header class="bg-navy sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <button
        @click="goHome()"
        class="flex items-center gap-2 text-white hover:opacity-80 transition-opacity"
      >
        <svg class="w-6 h-6 text-vera-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 013 10c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286z" />
        </svg>
        <span class="text-xl font-bold tracking-tight">VERA</span>
      </button>
      <span class="text-slate-400 text-xs hidden sm:block">Verified Environmental Review &amp; Attestation</span>
      <div class="flex items-center gap-3">
        <a href="/radar.html"
           class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-900/40 border border-red-700/50 text-red-300 text-xs font-semibold hover:bg-red-800/50 transition-colors">
          <span class="inline-block w-2 h-2 rounded-full bg-red-400 animate-pulse"></span>
          Stuckness Radar
        </a>
        <a href="/semantic.html"
           class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-teal-900/40 border border-teal-700/50 text-teal-300 text-xs font-semibold hover:bg-teal-800/50 transition-colors">
          <span class="inline-block w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
          Semantic Search
        </a>
        <a href="/dashboard.html" class="text-slate-400 text-xs hover:text-white transition-colors">Observatory →</a>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!--  SEARCH VIEW                                                       -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <main x-show="view === 'search'" class="max-w-3xl mx-auto px-4 pt-20 pb-16">

    <!-- Hero -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-navy mb-4">
        <svg class="w-8 h-8 text-vera-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 013 10c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286z" />
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-navy mb-2">VERA</h1>
      <p class="text-slate-500 text-lg">NEPA compliance risk — instant, auditable, tamper-proof</p>
    </div>

    <!-- Search bar -->
    <form @submit.prevent="search()" class="flex gap-2 mb-4">
      <input
        x-model="searchQuery"
        type="text"
        placeholder="Search projects by title, agency, or state…"
        class="flex-1 px-4 py-3 rounded-xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-vera-teal text-sm"
        autofocus
      />
      <button
        type="submit"
        :disabled="searchLoading"
        class="px-5 py-3 bg-navy text-white rounded-xl font-semibold text-sm hover:bg-navy-light disabled:opacity-50 transition-colors flex items-center gap-2"
      >
        <template x-if="searchLoading">
          <span class="vera-spinner w-4 h-4"></span>
        </template>
        <span x-text="searchLoading ? 'Searching…' : 'Search'"></span>
      </button>
    </form>

    <!-- Process type filter -->
    <div class="flex gap-2 mb-6">
      <template x-for="opt in [{v:'',l:'All'},{v:'CE',l:'CE'},{v:'EA',l:'EA'},{v:'EIS',l:'EIS'}]" :key="opt.v">
        <button
          @click="searchProcessType = opt.v; search()"
          :class="searchProcessType === opt.v
            ? 'bg-navy text-white'
            : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-400'"
          class="px-4 py-1.5 rounded-full text-xs font-semibold transition-colors"
          x-text="opt.l"
        ></button>
      </template>
    </div>

    <!-- Results list -->
    <template x-if="searchResults.length > 0">
      <ul class="space-y-2">
        <template x-for="p in searchResults" :key="p.id">
          <li>
            <button
              @click="openProject(p)"
              class="w-full text-left bg-white rounded-xl border border-slate-200 px-5 py-4 hover:border-vera-teal hover:shadow-md transition-all group"
            >
              <div class="flex items-start justify-between gap-4">
                <span class="font-semibold text-sm text-slate-800 group-hover:text-vera-teal-dark leading-snug" x-text="p.title"></span>
                <span
                  class="shrink-0 text-xs font-bold px-2 py-0.5 rounded-full"
                  :class="ptBadge(p.process_type)"
                  x-text="p.process_type"
                ></span>
              </div>
              <div class="mt-1.5 flex gap-4 text-xs text-slate-400">
                <span x-text="p.state || '—'"></span>
                <span class="truncate" x-text="p.agency || '—'"></span>
              </div>
            </button>
          </li>
        </template>
      </ul>
    </template>

    <template x-if="searched && searchResults.length === 0 && !searchLoading">
      <p class="text-center text-slate-400 py-12">No projects found. Try a different query.</p>
    </template>

  </main>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!--  PROJECT DETAIL VIEW                                               -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <div x-show="view === 'project'" class="flex h-[calc(100vh-3.5rem)]">

    <!-- Main column -->
    <div
      class="flex-1 overflow-y-auto"
      :class="chatOpen ? 'max-w-[calc(100%-24rem)]' : 'max-w-full'"
    >
      <div class="max-w-4xl mx-auto px-4 py-6">

        <!-- Back + action bar -->
        <div class="flex items-center justify-between mb-6">
          <button
            @click="goHome()"
            class="flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
            </svg>
            Back to search
          </button>
          <div class="flex gap-2">
            <button
              @click="runScan()"
              :disabled="scanLoading"
              class="flex items-center gap-2 px-4 py-2 bg-navy text-white text-sm font-semibold rounded-lg hover:bg-navy-light disabled:opacity-50 transition-colors"
            >
              <template x-if="scanLoading">
                <span class="vera-spinner w-4 h-4"></span>
              </template>
              <svg x-show="!scanLoading" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0016.803 15.803z"/>
              </svg>
              <span x-text="scanLoading ? 'Scanning…' : 'Run Scan'"></span>
            </button>
            <button
              @click="chatOpen = !chatOpen"
              class="flex items-center gap-2 px-4 py-2 bg-vera-teal text-white text-sm font-semibold rounded-lg hover:bg-vera-teal-dark transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
              </svg>
              Ask VERA
            </button>
          </div>
        </div>

        <!-- Project metadata -->
        <template x-if="project">
          <div>
            <h2 class="text-2xl font-bold text-navy mb-3 leading-tight" x-text="project.title"></h2>
            <div class="flex flex-wrap gap-3 mb-6">
              <span class="text-xs font-bold px-2.5 py-1 rounded-full" :class="ptBadge(project.process_type)" x-text="project.process_type"></span>
              <span class="text-xs text-slate-500 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z"/></svg>
                <span x-text="project.agency || 'Agency unknown'"></span>
              </span>
              <span class="text-xs text-slate-500 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
                <span x-text="project.state || 'State unknown'"></span>
              </span>
              <template x-if="project.register_date">
                <span class="text-xs text-slate-500" x-text="'Registered ' + project.register_date"></span>
              </template>
              <template x-if="project.status">
                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full" x-text="project.status"></span>
              </template>
            </div>

            <!-- Solana attestation badge (already attested) -->
            <template x-if="project.solana_tx_signature">
              <div class="flex items-center gap-3 mb-5 p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                <svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div class="flex-1 min-w-0">
                  <p class="text-xs font-semibold text-emerald-700">Attested on Solana</p>
                  <p class="text-xs text-emerald-600 font-mono truncate" x-text="project.solana_tx_signature"></p>
                  <template x-if="project.solana_attested_at">
                    <p class="text-xs text-emerald-500" x-text="'at ' + project.solana_attested_at"></p>
                  </template>
                </div>
                <a
                  :href="`https://explorer.solana.com/tx/${project.solana_tx_signature}?cluster=devnet`"
                  target="_blank"
                  rel="noopener"
                  class="text-xs font-semibold text-emerald-700 hover:underline whitespace-nowrap"
                >View on Explorer →</a>
              </div>
            </template>

            <!-- Documents -->
            <section class="mb-8">
              <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Documents</h3>
              <template x-if="!project.documents || project.documents.length === 0">
                <p class="text-sm text-slate-400">No documents.</p>
              </template>
              <ul class="space-y-2">
                <template x-for="doc in project.documents" :key="doc.id">
                  <li class="flex items-center gap-3 px-4 py-3 bg-white rounded-lg border border-slate-200">
                    <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                    </svg>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm text-slate-700 truncate" x-text="doc.title || doc.filename || doc.id"></p>
                      <div class="flex gap-3 mt-0.5">
                        <span class="text-xs text-slate-400" x-text="doc.doc_type || 'unknown type'"></span>
                        <template x-if="doc.page_count">
                          <span class="text-xs text-slate-400" x-text="doc.page_count + ' pages'"></span>
                        </template>
                      </div>
                    </div>
                    <template x-if="doc.is_main">
                      <span class="text-xs font-semibold px-2 py-0.5 bg-vera-teal text-white rounded-full">Main</span>
                    </template>
                  </li>
                </template>
              </ul>
            </section>

            <!-- Milestones -->
            <template x-if="project.milestones && project.milestones.length > 0">
              <section class="mb-8">
                <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Timeline</h3>
                <ol class="relative border-l-2 border-slate-200 ml-3 space-y-4">
                  <template x-for="m in project.milestones" :key="m.id">
                    <li class="ml-5 relative">
                      <span class="absolute -left-[1.65rem] w-3 h-3 bg-vera-teal rounded-full border-2 border-white mt-1"></span>
                      <p class="text-sm font-semibold text-slate-700" x-text="m.event_type"></p>
                      <template x-if="m.event_date">
                        <p class="text-xs text-slate-400" x-text="m.event_date"></p>
                      </template>
                    </li>
                  </template>
                </ol>
              </section>
            </template>

            <!-- ── Flags Panel ── -->
            <template x-if="flags !== null">
              <section id="flags-panel">
                <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Compliance Flags</h3>
                  <div class="flex items-center gap-2">
                    <button
                      @click="loadFlagsWithExplanations()"
                      :disabled="flagsExplainLoading"
                      class="text-xs font-medium text-indigo-600 hover:text-indigo-800 disabled:opacity-50"
                    >
                      <span x-show="!flagsExplainLoading">Explain with AI</span>
                      <span x-show="flagsExplainLoading" class="inline-flex items-center gap-1"><span class="vera-spinner w-3 h-3"></span> Explaining…</span>
                    </button>
                    <div class="flex gap-2 text-xs font-semibold">
                    <span class="text-red-600" x-text="`${(flags.high||[]).length} high`"></span>
                    <span class="text-amber-600" x-text="`· ${(flags.medium||[]).length} medium`"></span>
                    <span class="text-blue-600" x-text="`· ${(flags.info||[]).length} info`"></span>
                    <span class="text-slate-400" x-show="(flags.low||[]).length > 0" x-text="`· ${flags.low.length} low`"></span>
                    </div>
                  </div>
                </div>

                <!-- Flag groups -->
                <template x-for="sev in ['high','medium','low','info']" :key="sev">
                  <template x-if="flags[sev] && flags[sev].length > 0">
                    <div class="mb-6">
                      <h4
                        class="text-xs font-bold uppercase tracking-wider mb-3"
                        :class="{high:'text-red-600',medium:'text-amber-600',low:'text-slate-500',info:'text-blue-600'}[sev]"
                        x-text="sev"
                      ></h4>
                      <div class="space-y-3">
                        <template x-for="(flag, i) in flags[sev]" :key="flag.flag_type + '-' + flag.severity + '-' + i">
                          <div
                            class="rounded-xl border p-4"
                            :class="{high:'border-red-200 bg-red-50',medium:'border-amber-200 bg-amber-50',low:'border-slate-200 bg-white',info:'border-blue-200 bg-blue-50'}[sev]"
                          >
                            <div class="flex items-start gap-3 mb-2">
                              <span
                                class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0"
                                :class="{high:'bg-red-100 text-red-700',medium:'bg-amber-100 text-amber-700',low:'bg-slate-100 text-slate-600',info:'bg-blue-100 text-blue-700'}[sev]"
                                x-text="sev"
                              ></span>
                              <span class="text-xs font-mono font-semibold bg-slate-800 text-slate-100 px-2 py-0.5 rounded" x-text="flag.flag_type"></span>
                              <span class="text-sm font-semibold text-slate-800 leading-tight" x-text="flag.title"></span>
                            </div>
                            <p class="text-xs text-slate-600 mb-2" x-text="flag.description"></p>
                            <template x-if="flag.source_documents && flag.source_documents.length > 0">
                              <p class="text-xs text-slate-500 mb-2">
                                <span class="font-semibold">Source:</span>
                                <span x-text="(flag.source_documents || []).map(d => d.filename || d.title || d.document_id || 'document').join(', ')"></span>
                              </p>
                            </template>
                            <template x-if="flag.explanation">
                              <p class="text-xs text-slate-700 bg-slate-100 rounded-lg px-3 py-2 mb-2 border-l-2 border-indigo-300" x-text="flag.explanation"></p>
                            </template>
                            <template x-if="flag.excerpt">
                              <pre class="text-xs font-mono bg-slate-900 text-emerald-300 rounded-lg px-3 py-2 overflow-x-auto whitespace-pre-wrap break-words" x-text="flag.excerpt"></pre>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </template>

                <!-- Attest on Solana -->
                <div class="mt-6 pt-5 border-t border-slate-200">
                  <template x-if="!attestResult">
                    <button
                      @click="attest()"
                      :disabled="attestLoading"
                      class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-purple-700 to-indigo-700 text-white text-sm font-semibold rounded-xl hover:from-purple-800 hover:to-indigo-800 disabled:opacity-50 transition-all shadow"
                    >
                      <template x-if="attestLoading">
                        <span class="vera-spinner w-4 h-4"></span>
                      </template>
                      <svg x-show="!attestLoading" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"/>
                      </svg>
                      <span x-text="attestLoading ? 'Attesting…' : 'Attest on Solana'"></span>
                    </button>
                  </template>

                  <template x-if="attestResult">
                    <div class="flex flex-wrap items-center gap-4 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
                      <div class="flex items-center gap-2 text-emerald-700 font-semibold text-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Attested ✓
                      </div>
                      <span class="font-mono text-xs text-emerald-600 truncate max-w-[14rem]" x-text="truncateSig(attestResult.tx_signature)"></span>
                      <a
                        :href="attestResult.explorer_url || `https://explorer.solana.com/tx/${attestResult.tx_signature}?cluster=devnet`"
                        target="_blank" rel="noopener"
                        class="text-xs font-semibold text-emerald-700 hover:underline"
                      >View on Solana Explorer →</a>
                    </div>
                  </template>
                </div>

              </section>
            </template>

            <!-- Prompt to run scan if no flags yet -->
            <template x-if="flags === null">
              <div class="text-center py-12 text-slate-400 border-2 border-dashed border-slate-200 rounded-xl">
                <svg class="w-8 h-8 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0016.803 15.803z"/>
                </svg>
                <p class="text-sm font-medium">Click <strong>Run Scan</strong> to detect compliance flags</p>
              </div>
            </template>

          </div>
        </template>

      </div>
    </div>

    <!-- ── Chat sidebar ─────────────────────────────────────────────── -->
    <aside
      x-show="chatOpen"
      class="w-96 shrink-0 border-l border-slate-200 bg-white flex flex-col h-full"
      x-transition:enter="transition-transform duration-200"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
    >
      <!-- Chat header -->
      <div class="flex items-center justify-between px-4 py-3 bg-navy text-white shrink-0">
        <div>
          <p class="font-bold text-sm">Ask VERA</p>
          <p class="text-xs text-slate-400 truncate max-w-[220px]" x-text="project ? 'Asking about: ' + project.title : ''"></p>
        </div>
        <button @click="chatOpen = false" class="text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Chat tabs -->
      <div class="flex border-b border-slate-200 shrink-0">
        <button
          @click="chatTab = 'project'"
          :class="chatTab === 'project' ? 'border-b-2 border-vera-teal text-vera-teal-dark font-semibold' : 'text-slate-500 hover:text-slate-700'"
          class="flex-1 text-xs py-2.5 transition-colors"
        >This Project</button>
        <button
          @click="chatTab = 'all'"
          :class="chatTab === 'all' ? 'border-b-2 border-vera-teal text-vera-teal-dark font-semibold' : 'text-slate-500 hover:text-slate-700'"
          class="flex-1 text-xs py-2.5 transition-colors"
        >All Projects</button>
      </div>

      <!-- Message thread -->
      <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3" x-ref="chatThread">
        <template x-if="chatMessages.length === 0">
          <p class="text-xs text-slate-400 text-center mt-6">Ask a question about this document or NEPA compliance.</p>
        </template>
        <template x-for="msg in chatMessages" :key="msg.id">
          <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
            <div
              class="max-w-[85%] text-xs rounded-2xl px-4 py-2.5 leading-relaxed"
              :class="msg.role === 'user' ? 'bg-vera-teal text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm'"
              x-text="msg.content"
            ></div>
          </div>
        </template>
        <!-- Typing indicator -->
        <template x-if="chatLoading">
          <div class="flex justify-start">
            <div class="bg-slate-100 rounded-2xl rounded-bl-sm px-4 py-3">
              <div class="flex gap-1">
                <span class="vera-dot"></span>
                <span class="vera-dot" style="animation-delay:.15s"></span>
                <span class="vera-dot" style="animation-delay:.3s"></span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Chat input -->
      <form @submit.prevent="sendChat()" class="flex gap-2 px-3 py-3 border-t border-slate-200 shrink-0">
        <input
          x-model="chatInput"
          type="text"
          placeholder="Ask a question…"
          class="flex-1 text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vera-teal"
          :disabled="chatLoading"
        />
        <button
          type="submit"
          :disabled="chatLoading || !chatInput.trim()"
          class="px-3 py-2 bg-vera-teal text-white rounded-lg disabled:opacity-40 hover:bg-vera-teal-dark transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.269 20.876L5.999 12zm0 0h7.5"/>
          </svg>
        </button>
      </form>
    </aside>

  </div><!-- /project view -->

  <script src="/app.js"></script>
</body>
</html>
